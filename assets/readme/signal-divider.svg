<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" role="img" aria-label="Divisor com movimento suave">
  <style>
    .line { stroke: #d4d4d4; }
    .pulse { animation: slide 7s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(1080px); } }
    @media (prefers-color-scheme: dark) { .line { stroke: #404040; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; transform: translateX(540px); } }
  </style>
  <defs>
    <linearGradient id="signal">
      <stop stop-color="#f97316" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 9H1200" class="line" fill="none"/>
  <rect class="pulse" y="8" width="120" height="2" rx="1" fill="url(#signal)"/>
</svg>
